# 가사 서버 — 컨테이너 운영(미니 서버 등으로 옮길 때).
#
#   cd <저장소 루트>
#   docker compose -f src/Musebase.Server/deploy/docker-compose.yml up -d --build
#
# 준비:
#   1) 이 폴더에 .env 를 만들고 MUSEBASE_TOKEN 등을 넣는다(아래 키 참고 — 커밋 금지).
#   2) 기존 서버의 lyrics.db 가 있으면 볼륨에 넣는다(deploy/README.md "다른 서버로 옮기기" 절).
#
# 노출은 호스트의 tailscale이 담당한다(컨테이너는 루프백에만 바인딩):
#   sudo tailscale serve --bg --https=443 http://127.0.0.1:5180
#
# 백업은 호스트 타이머가 `docker exec`로 돌린다(같은 절 참고) — 컨테이너 안에 스케줄러를 두지 않는다.
services:
  musebase-server:
    build:
      # 컨텍스트는 저장소 루트여야 한다(Musebase.Core를 함께 복사하므로).
      context: ../../..
      dockerfile: src/Musebase.Server/Dockerfile
    image: musebase-server:latest
    container_name: musebase-server
    restart: unless-stopped
    # 127.0.0.1에만 바인딩 — 공개 포트를 열지 않는다.
    ports:
      - "127.0.0.1:5180:5180"
    environment:
      MUSEBASE_TOKEN: ${MUSEBASE_TOKEN:?MUSEBASE_TOKEN이 필요합니다(.env 참고)}
      MUSEBASE_ADMIN_TOKEN: ${MUSEBASE_ADMIN_TOKEN:-}
      MUSEBASE_DEVICES: ${MUSEBASE_DEVICES:-}
      MUSEBASE_TZ: ${MUSEBASE_TZ:-Asia/Seoul}
      MUSEBASE_LOG_LOOKUPS: ${MUSEBASE_LOG_LOOKUPS:-1}
      MUSEBASE_LOOKUP_RETENTION_DAYS: ${MUSEBASE_LOOKUP_RETENTION_DAYS:-90}
      MUSEBASE_BACKUP_DIR: /backups
      MUSEBASE_BACKUP_KEEP_DAYS: ${MUSEBASE_BACKUP_KEEP_DAYS:-14}
    volumes:
      # 이름 있는 볼륨: 도커가 권한을 맞춰 준다(바인드 마운트면 chown 1654:1654 필요).
      - musebase-data:/data
      - musebase-backups:/backups
      # 백업 스크립트를 컨테이너 안에서 실행할 수 있게 붙여 둔다(docker exec 용).
      - ./backup.sh:/app/backup.sh:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  musebase-data:
  musebase-backups:
