# CI 게이트: PR/push마다 전체 .NET 솔루션 빌드 + 유닛 테스트.
# 모노레포 원칙 — 코어/엔진이 바뀌면 모든 .NET 헤드가 같은 솔루션으로 함께 빌드되어
# 깨짐이 자동 발견된다. (Apple(Swift) 헤드가 생기면 macos 러너 잡을 추가한다.)
name: CI

on:
  pull_request:
    branches: [master, beta]
  push:
    branches: [master, beta]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    runs-on: windows-latest # WPF 헤드(net8.0-windows) 포함 빌드에 필요
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build Musebase.sln -c Release
      - name: Test
        run: dotnet test tests/Musebase.Core.Tests -c Release --no-build

  # Android 헤드는 워크로드가 필요해 솔루션에 넣지 않았다 — 그래서 예전에는 CI가 전혀 빌드하지 않았고,
  # 코어 변경이 Android를 깨도 릴리스 직전까지 몰랐다. 러너에는 JDK·Android SDK가 이미 있어
  # 워크로드만 깔면 된다. (필수 검사로 걸지는 않는다 — 결과는 PR에 그대로 보인다.)
  android:
    runs-on: ubuntu-latest
    env:
      # 릴리스 키(고정). 등록돼 있을 때만 서명된 APK를 만든다 — 포크에서 온 PR에는 시크릿이 없다.
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      # 러너의 기본 SDK(10)는 지원이 끝난 net8.0-android 워크로드를 NETSDK1202 오류로 거부한다.
      # 로컬 빌드·0.7.0 릴리스와 같은 SDK 8로 고정한다(이 작업 안에서만 — 저장소에는 global.json이 없다).
      - name: Pin SDK 8
        run: dotnet new globaljson --sdk-version "$(dotnet --list-sdks | grep '^8\.' | tail -1 | cut -d' ' -f1)" --force
      - name: Install android workload
        run: dotnet workload install android
      - name: Build
        run: dotnet build src/Musebase.Android/Musebase.Android.csproj -c Release -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"

      # 폰에 바로 설치할 APK. 예전 릴리스는 빌드한 PC의 디버그 키로 서명돼, 그 PC가 없으면 업데이트를
      # 낼 수 없었다(실제로 그렇게 됐다). 이제 고정 릴리스 키로 어디서든 같은 서명을 만든다.
      # 구성은 예전 릴리스와 같은 Debug다 — Release의 트리밍이 리플렉션(JSON 등)을 깨뜨릴 수 있어
      # 사이드로드 앱은 그대로 둔다. 비밀번호는 명령줄 대신 env:로 넘긴다(로그·프로세스 목록에 안 남게).
      - name: Signed APK
        if: env.ANDROID_KEYSTORE_B64 != ''
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          dotnet build src/Musebase.Android/Musebase.Android.csproj -c Debug             -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"             -p:AndroidKeyStore=true             -p:AndroidSigningKeyStore="$RUNNER_TEMP/release.p12"             -p:AndroidSigningKeyAlias=musebase             -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASS             -p:AndroidSigningKeyPass=env:ANDROID_KEYSTORE_PASS
          rm -f "$RUNNER_TEMP/release.p12"
      - name: Upload APK
        if: env.ANDROID_KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: musebase-android-apk
          path: src/Musebase.Android/bin/Debug/net8.0-android/*-Signed.apk
          retention-days: 14
